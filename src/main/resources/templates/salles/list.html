<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Salles disponibles | BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="page-header py-4">
    <div class="container">
        <h1 class="page-title"><i class="bi bi-grid me-2"></i>Nos Salles</h1>
        <p class="page-subtitle mb-0">Découvrez et réservez l'espace parfait pour vos besoins.</p>
    </div>
</div>

<div class="container py-4">

    <!-- Search bar -->
    <div class="card search-card mb-4">
        <div class="card-body">
            <form th:action="@{/salles}" method="get" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Nom de la salle</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="nom" class="form-control"
                               placeholder="Rechercher..." th:value="${nom}"/>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Localisation</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" name="localisation" class="form-control"
                               placeholder="Bâtiment, étage..." th:value="${localisation}"/>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Capacité min.</label>
                    <input type="number" name="minCapacite" class="form-control"
                           min="1" placeholder="ex: 10" th:value="${minCapacite}"/>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-gold flex-fill">
                        <i class="bi bi-funnel me-1"></i>Filtrer
                    </button>
                    <a th:href="@{/salles}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Results count -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="mb-0 text-muted">
            <span th:text="${sallesPage.totalElements}">0</span> salle(s) trouvée(s)
        </p>
    </div>

    <!-- Salles grid -->
    <div class="row g-4" th:if="${!sallesPage.empty}">
        <div class="col-md-4" th:each="salle : ${sallesPage.content}">
            <div class="card salle-card h-100">
                <div class="card-img-wrapper">
                    <img th:if="${salle.imageUrl != null}"
                         th:src="@{'/uploads/' + ${salle.imageUrl}}"
                         class="card-img-top"
                         th:alt="${salle.nom}"/>
                    <div th:if="${salle.imageUrl == null}" class="card-img-placeholder">
                        <i class="bi bi-building display-4"></i>
                    </div>
                    <span class="badge-disponible" th:if="${salle.disponible}">Disponible</span>
                    <span class="badge-indisponible" th:unless="${salle.disponible}">Indisponible</span>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${salle.nom}">Nom salle</h5>
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <span class="badge badge-capacity">
                            <i class="bi bi-people-fill me-1"></i>
                            <span th:text="${salle.capacite} + ' personnes'">20 personnes</span>
                        </span>
                        <span class="badge badge-location" th:if="${salle.localisation != null}">
                            <i class="bi bi-geo-alt-fill me-1"></i>
                            <span th:text="${salle.localisation}">Lieu</span>
                        </span>
                    </div>
                    <p class="card-text text-muted small"
                       th:text="${salle.description != null ? (salle.description.length() > 80 ? salle.description.substring(0,80) + '...' : salle.description) : ''}">
                        Description
                    </p>
                </div>
                <div class="card-footer bg-transparent border-0 pb-3">
                    <a th:href="@{/salles/{id}(id=${salle.id})}" class="btn btn-primary-custom w-100">
                        <i class="bi bi-eye me-2"></i>Voir &amp; Réserver
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${sallesPage.empty}" class="text-center py-5">
        <i class="bi bi-search display-1 text-muted"></i>
        <h4 class="mt-3 text-muted">Aucune salle trouvée</h4>
        <p class="text-muted">Essayez d'autres critères de recherche.</p>
        <a th:href="@{/salles}" class="btn btn-gold">Voir toutes les salles</a>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/salles(page=${currentPage - 1}, nom=${nom}, localisation=${localisation}, minCapacite=${minCapacite})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/salles(page=${i}, nom=${nom}, localisation=${localisation}, minCapacite=${minCapacite})}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/salles(page=${currentPage + 1}, nom=${nom}, localisation=${localisation}, minCapacite=${minCapacite})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
