<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Connexion | BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card card shadow-lg">
        <div class="auth-header text-center p-4">
            <a th:href="@{/}" class="auth-logo"><i class="bi bi-building me-2"></i>BookNest</a>
            <h4 class="mt-3 mb-0 text-white">Bienvenue !</h4>
            <p class="text-white-50 small">Connectez-vous à votre compte</p>
        </div>
        <div class="card-body p-4">

            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Email ou mot de passe incorrect.
            </div>
            <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center">
                <i class="bi bi-info-circle-fill me-2"></i>
                Vous avez été déconnecté.
            </div>
            <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center">
                <i class="bi bi-check-circle-fill me-2"></i>
                Compte créé ! Vous pouvez vous connecter.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="username" name="username"
                               class="form-control" placeholder="vous@example.com" required/>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="••••••••" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0 text-muted">Pas encore de compte ?
                    <a th:href="@{/register}" class="link-gold fw-semibold">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
