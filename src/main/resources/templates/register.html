<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inscription | BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card card shadow-lg">
        <div class="auth-header text-center p-4">
            <a th:href="@{/}" class="auth-logo"><i class="bi bi-building me-2"></i>BookNest</a>
            <h4 class="mt-3 mb-0 text-white">Créer un compte</h4>
            <p class="text-white-50 small">Rejoignez BookNest gratuitement</p>
        </div>
        <div class="card-body p-4">

            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Erreur</span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom complet</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" th:field="*{nom}"
                               class="form-control" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"
                               placeholder="Jean Dupont" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}"
                               class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="vous@example.com" required/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{motDePasse}"
                               class="form-control"
                               placeholder="Minimum 6 caractères" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-2 fw-semibold">
                    <i class="bi bi-person-plus me-2"></i>Créer mon compte
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0 text-muted">Déjà inscrit ?
                    <a th:href="@{/login}" class="link-gold fw-semibold">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
