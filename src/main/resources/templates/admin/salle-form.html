<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${salle.id == null} ? 'Nouvelle Salle' : 'Modifier Salle'">Salle | BookNest Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="page-header py-4">
    <div class="container">
        <h1 class="page-title">
            <i class="bi bi-building-add me-2"></i>
            <span th:text="${salle.id == null} ? 'Nouvelle Salle' : 'Modifier : ' + ${salle.nom}">Salle</span>
        </h1>
    </div>
</div>

<div class="container py-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/admin/salles/save}" th:object="${salle}"
                  method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom de la salle <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{nom}" class="form-control"
                           placeholder="Ex: Salle Alpha" required/>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Capacité <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{capacite}" class="form-control"
                               min="1" placeholder="Nombre de personnes" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Localisation</label>
                        <input type="text" th:field="*{localisation}" class="form-control"
                               placeholder="Ex: Bâtiment A, 2ème étage"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="4"
                              placeholder="Décrivez la salle, ses équipements..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Image</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*"/>
                    <div th:if="${salle.imageUrl != null}" class="mt-2">
                        <small class="text-muted">Image actuelle: <span th:text="${salle.imageUrl}">fichier</span></small>
                    </div>
                </div>
                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{disponible}" role="switch"/>
                        <label class="form-check-label fw-semibold">Salle disponible</label>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-gold px-4">
                        <i class="bi bi-save me-2"></i>Enregistrer
                    </button>
                    <a th:href="@{/admin/salles}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
